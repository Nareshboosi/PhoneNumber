<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>PhoneNumber</title>
</head>
<body>
    <center>
        <h1>Phone Number</h1>
        <form action="./pnmain.html">
            <label for="pn"><b>Phone Number:</b></label>
            <input type="text" id="pn" name="pn" placeholder="Enter mobile Number" pattern="[+][9][1][\s][6-9][\d]{9}" title="Enter Valid Number" required><br><br>
           <button type="submit">Submit</button>
        </form>
    </center>
</body>
</html>
